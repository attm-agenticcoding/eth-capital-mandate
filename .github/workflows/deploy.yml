name: refresh-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: '0 */6 * * *' # every 6 hours

# Needed to push the data commit (longitudinal record) and to deploy Pages.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Fetch live data (all AUTO metrics)
        run: npm run fetch

      - name: Commit data — the git log IS the longitudinal record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.ndjson data/history.json
          if git diff --staged --quiet; then
            echo "no data changes"
          else
            # [skip ci] prevents this data push from re-triggering the workflow
            git commit -m "data: refresh $(date -u +%FT%TZ) [skip ci]"
            git push
          fi

      - name: Build static site (bakes in the fresh snapshot)
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
